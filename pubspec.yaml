name: simple_order_manager
description: "Gestione preventivi, ordini, clienti e catalogo senza fatturazione"
publish_to: 'none'
version: 1.8.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Pin esatto (non `^`): `^1.1.2` risolverebbe su 1.2.4, che richiede Dart
  # 3.11 e romperebbe la build con Flutter 3.27.4 (Dart 3.6).
  image_picker: 1.1.2
  # Scelta file `.svg` (il selectorlo della galleria non offre formati
  # arbitrari): pin esatto compatibile con Flutter 3.27.4 / Dart 3.6.
  file_picker: 8.1.6
  # Normalizzazione del logo in Dart puro: era già presente come dipendenza
  # transitiva di `pdf_widget_wrapper`, qui diventa diretta.
  image: ^4.5.4
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.3
  share_plus: ^11.1.0
  shared_preferences: ^2.2.2
  # Client SMTP per l'invio dei preventivi (Impostazioni → Posta in uscita).
  # Alternativa a `mailer` (indicato nel piano): **nessuna** release di
  # `mailer` è compatibile con Flutter 3.27.4 / Dart 3.6 — la 6.x richiede
  # SDK `<3.0.0`, la 7.x (via `punycoder`) `>=3.7.2`. `enough_mail` 2.1.6
  # dichiara `>=2.19.0 <4.0.0`: SMTP + MIME + allegati in Dart puro
  # (`dart:io`, nessun plugin di piattaforma). Pin esatto (stessa policy di
  # image_picker/file_picker).
  enough_mail: 2.1.6
  # Registrazione audio AAC/M4A per l'inserimento vocale dei preventivi
  # (pulsante microfono in OrderEditScreen). Pin esatto: le release 7.x
  # potrebbero alzare il floor dello SDK oltre Dart 3.6.
  record: 6.1.2
  # Permessi runtime (microfono) richiesti da `record` su Android/iOS.
  permission_handler: 11.4.0
  # Integrazione Gemini: chiamate generateContent con Structured Outputs
  # (JSON Schema) per estrarre cliente e voci dall'audio.
  google_generative_ai: 0.4.3
  # Chiamate dirette ai vertici REST di Google (elenco `/models` per la
  # sincronizzazione dinamica dei modelli nelle impostazioni AI).
  http: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    # Catalogo importato dal listino allegato alla issue #25 (12.351 articoli,
    # colonne A–F: descrizione, unità di misura, divisa, prezzo, sconti, IVA).
    # Viene caricato al primo avvio quando non esistono ancora dati salvati e
    # non viene sovrascritto finché l'utente non modifica il listino.
    - assets/catalog/catalogo.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
