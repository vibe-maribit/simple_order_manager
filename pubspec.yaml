name: simple_order_manager
description: "Gestione preventivi, ordini, clienti e catalogo senza fatturazione"
publish_to: 'none'
version: 1.6.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Pin esatto (non `^`): `^1.1.2` risolverebbe su 1.2.4, che richiede Dart
  # 3.11 e romperebbe la build con Flutter 3.27.4 (Dart 3.6).
  image_picker: 1.1.2
  # Scelta file `.svg` (il selectorlo della galleria non offre formati
  # arbitrari): pin esatto compatibile con Flutter 3.27.4 / Dart 3.6.
  file_picker: 8.1.6
  # Normalizzazione del logo in Dart puro: era già presente come dipendenza
  # transitiva di `pdf_widget_wrapper`, qui diventa diretta.
  image: ^4.5.4
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.3
  share_plus: ^11.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
