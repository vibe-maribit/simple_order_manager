name: OpenCode GitHub Integration

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Istruzione manuale per OpenCode"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  opencode-github:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '/oc') || contains(github.event.issue.body, '/opencode'))) ||
      (github.event_name != 'issues' &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GH_API: "https://api.github.com"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      COMMENT_BODY: ${{ github.event.comment.body || github.event.issue.body || github.event.inputs.prompt }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login || github.event.issue.user.login || github.actor }}
      COMMENT_ID: ${{ github.event.comment.id }}
      IS_PR_EVENT: ${{ github.event_name == 'pull_request_review_comment' }}
      IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
      PR_NUMBER_FROM_EVENT: ${{ github.event.pull_request.number }}
      PR_HEAD_REF_FROM_EVENT: ${{ github.event.pull_request.head.ref }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      RUN_NUMBER: ${{ github.run_number }}
      # OpenCode: nessun API key necessario per i modelli gratuiti Zen
      OPENCODE_MODEL: opencode/big-pickle
      MAX_ITERATIONS: "4"

    steps:
      # ── 1. Autorizzazione ────────────────────────────────────────────────────
      - name: Verifica autorizzazione utente
        run: |
          # Lista utenti modificabile senza toccare il YAML:
          # Repo → Settings → Variables → Actions → OPENCODE_ALLOWED_USERS
          ALLOWED_USERS="${{ vars.OPENCODE_ALLOWED_USERS || 'nik2208 vibe-maribit' }}"
          if [ "$IS_MANUAL" = "true" ]; then exit 0; fi
          if ! echo " $ALLOWED_USERS " | grep -q " $COMMENT_AUTHOR "; then
            echo "Utente '$COMMENT_AUTHOR' non autorizzato. Interrompo."
            exit 1
          fi

      # ── 2. Feedback immediato 👀 ─────────────────────────────────────────────
      - name: Reagisci al comando (👀)
        id: react
        run: |
          API="$GH_API/repos/$REPO"
          if [ -n "$COMMENT_ID" ]; then
            RPATH="issues/comments/$COMMENT_ID/reactions"
          elif [ -n "$ISSUE_NUMBER" ]; then
            RPATH="issues/$ISSUE_NUMBER/reactions"
          else
            RPATH=""
          fi
          echo "path=$RPATH" >> "$GITHUB_OUTPUT"
          if [ -n "$RPATH" ]; then
            curl -s -X POST "$API/$RPATH" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"content":"eyes"}' > /dev/null || true
          fi

      # ── 3. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura git con token GitHub
        run: |
          git config --global user.name "opencode-bot"
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

      # ── 3b. Setup ambiente SDK [SPECIFICO PER FLUTTER] ────────────────────────
      # NOTA: Questa sezione è specifica per questo progetto Flutter. Pre-installa
      # Flutter SDK e Java con caching rapido (30 secondi), evitando che OpenCode
      # perda 15-20 minuti a scaricare l'SDK da zero in /tmp ad ogni run.
      # Se questo workflow viene riutilizzato su un altro progetto (es. Node.js, Python,
      # Go, Rust), questa sezione va sostituita con l'action apposita (es. setup-node, setup-python).
      - name: Set up Java 17 (per Android tooling)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK (specifico per questo progetto)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true

      # ── 4. OpenCode CLI (nessuna API key richiesta) ──────────────────────────
      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Configura agent reviewer (read-only)
        run: |
          mkdir -p .opencode/agents
          cat > .opencode/agents/reviewer.md << 'EOF'
          ---
          description: Revisore read-only che verifica gli acceptance criteria eseguendo i test, senza modificare il codice.
          mode: primary
          permission:
            edit: deny
            webfetch: deny
            bash: allow
          tools:
            write: false
            edit: false
            bash: true
          ---
          Sei un revisore di codice rigoroso in SOLA LETTURA.
          Non modificare mai i file: puoi solo leggere il codice ed eseguire comandi
          di verifica (build, lint, test). Stabilisci se ogni Acceptance Criterion
          del piano è oggettivamente soddisfatto sul codice attuale.
          EOF
          grep -qxF '.opencode/' .git/info/exclude 2>/dev/null || echo '.opencode/' >> .git/info/exclude

      # ── 5. Contesto (branch / issue / PR) ───────────────────────────────────
      - name: Determina contesto e branch di lavoro
        id: ctx
        run: |
          set -e
          API="$GH_API/repos/$REPO"

          if [ "$IS_MANUAL" = "true" ]; then
            IS_PR=false; PR_NUMBER=""; BRANCH_NAME="opencode-manual-$RUN_NUMBER"
          elif [ "$IS_PR_EVENT" = "true" ]; then
            IS_PR=true; PR_NUMBER="$PR_NUMBER_FROM_EVENT"; BRANCH_NAME="$PR_HEAD_REF_FROM_EVENT"
          else
            ISSUE_JSON=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/issues/$ISSUE_NUMBER")
            if echo "$ISSUE_JSON" | jq -e '.pull_request' > /dev/null 2>&1; then
              IS_PR=true; PR_NUMBER="$ISSUE_NUMBER"
              BRANCH_NAME=$(curl -s \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/pulls/$PR_NUMBER" | jq -r '.head.ref')
            else
              IS_PR=false; PR_NUMBER=""; BRANCH_NAME="opencode-issue-$ISSUE_NUMBER"
            fi
          fi

          PLAN_KEY=$(printf '%s' "$BRANCH_NAME" | tr '/' '-')
          echo "is_pr=$IS_PR"             >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER"     >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "plan_key=$PLAN_KEY"       >> "$GITHUB_OUTPUT"

          if [ "$IS_PR" = "true" ]; then
            git fetch origin "$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          elif git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null 2>&1; then
            git fetch origin "$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

      - name: Raccogli contesto aggiuntivo (diff + commenti se PR)
        run: |
          API="$GH_API/repos/$REPO"
          : > /tmp/context.txt
          if [ "${{ steps.ctx.outputs.is_pr }}" = "true" ]; then
            PR_NUMBER="${{ steps.ctx.outputs.pr_number }}"
            echo "== Diff della PR ==" >> /tmp/context.txt
            curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.diff" \
              "$API/pulls/$PR_NUMBER" >> /tmp/context.txt
            echo "== Commenti recenti ==" >> /tmp/context.txt
            curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/issues/$PR_NUMBER/comments" \
              | jq -r '.[] | "- (\(.user.login)): \(.body)"' >> /tmp/context.txt || true
          fi

      - name: Pulisci il comando dal trigger
        run: |
          printf '%s' "$COMMENT_BODY" | sed -e 's|/opencode||g' -e 's|/oc||g' > /tmp/clean_prompt.txt

      # ── 6. Fase 1: PLAN ─────────────────────────────────────────────────────
      - name: "Fase 1 — Plan (analisi read-only)"
        if: steps.ctx.outputs.is_pr != 'true'
        run: |
          CLEAN_PROMPT=$(cat /tmp/clean_prompt.txt)
          CONTEXT=$(cat /tmp/context.txt 2>/dev/null || true)
          mkdir -p issue_plans
          PLAN_FILE="issue_plans/${{ steps.ctx.outputs.plan_key }}.md"

          opencode run --agent plan --model "$OPENCODE_MODEL" \
            "Sei in modalità PLAN (SOLA LETTURA): NON modificare alcun file.
          Analizza il codebase e la richiesta, poi produci un piano di lavoro in Markdown
          con questa struttura ESATTA:

          # Piano
          ## Obiettivo
          ## Task
          (elenco numerato di task atomici; per ciascuno i file coinvolti)
          ## Acceptance Criteria
          (checklist '- [ ] ...' di criteri oggettivi e verificabili)
          ## Verifica
          (come testare: comandi da lanciare, cosa controllare)

          Richiesta ($COMMENT_AUTHOR): $CLEAN_PROMPT
          Contesto: $ISSUE_TITLE - $ISSUE_BODY
          $CONTEXT

          Restituisci SOLO il documento Markdown del piano." | tee "$PLAN_FILE"

          cp "$PLAN_FILE" /tmp/plan.md
          git add "$PLAN_FILE"
          git commit -m "OpenCode: piano di lavoro (${{ steps.ctx.outputs.plan_key }})" \
            || echo "Nessun piano da committare."

      # ── 7. Fase 2: BUILD + REVIEW loop ──────────────────────────────────────
      - name: "Fase 2 — Build & Review loop"
        id: build_review
        run: |
          CLEAN_PROMPT=$(cat /tmp/clean_prompt.txt)
          CONTEXT=$(cat /tmp/context.txt 2>/dev/null || true)
          PLAN=""; [ -f /tmp/plan.md ] && PLAN="$(cat /tmp/plan.md)"
          REVIEW_FEEDBACK="(prima iterazione: nessun feedback)"
          VERDICT="FAIL"

          for i in $(seq 1 "$MAX_ITERATIONS"); do
            echo "::group::Iterazione $i — BUILD"
            opencode run --agent build --auto --model "$OPENCODE_MODEL" \
              "Sei in modalità BUILD. Implementa il piano completando TUTTI i task e
            soddisfacendo TUTTI gli Acceptance Criteria. Applica le modifiche ai file.

            === PIANO ===
            ${PLAN:-Nessun piano formale. Richiesta: $CLEAN_PROMPT}

            === CONTESTO ===
            $CONTEXT

            === FEEDBACK REVIEW PRECEDENTE ===
            $REVIEW_FEEDBACK"
            echo "::endgroup::"

            echo "::group::Iterazione $i — REVIEW"
            opencode run --agent reviewer --auto --model "$OPENCODE_MODEL" \
              "Verifica sul codice ATTUALE se OGNI Acceptance Criterion del piano è
            soddisfatto. Puoi eseguire build/lint/test ma NON modificare i file.

            === PIANO ===
            ${PLAN:-Richiesta originale: $CLEAN_PROMPT}

            Scrivi come ULTIMA riga ESATTAMENTE una di queste:
            - 'VERDICT: PASS'  se tutti i criteri sono soddisfatti
            - 'VERDICT: FAIL'  altrimenti, seguita da un elenco puntato dei criteri NON
              soddisfatti e di cosa manca." | tee /tmp/review.txt
            echo "::endgroup::"

            if grep -q 'VERDICT: PASS' /tmp/review.txt; then
              echo "✅ Acceptance criteria soddisfatti all'iterazione $i."
              VERDICT="PASS"
              break
            fi
            REVIEW_FEEDBACK="$(cat /tmp/review.txt)"
            echo "⚠️ Criteri non soddisfatti: procedo con iterazione $((i+1))."
          done

          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          if [ "$VERDICT" != "PASS" ]; then
            echo "Raggiunto il tetto di $MAX_ITERATIONS iterazioni senza PASS."
          fi

      # ── 8. Push + PR ─────────────────────────────────────────────────────────
      - name: Pusha modifiche e apri/aggiorna PR
        id: push
        run: |
          API="$GH_API/repos/$REPO"
          BRANCH_NAME="${{ steps.ctx.outputs.branch_name }}"

          git add .
          git commit -m "OpenCode (big-pickle): $BRANCH_NAME" || echo "Niente di nuovo."

          if git diff --quiet origin/main..HEAD 2>/dev/null; then
            echo "Nessuna modifica rispetto a main."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin "$BRANCH_NAME"

          if [ "${{ steps.ctx.outputs.is_pr }}" = "true" ]; then
            PR_NUMBER="${{ steps.ctx.outputs.pr_number }}"
          else
            RESP=$(curl -s -X POST "$API/pulls" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "{
                \"base\": \"main\",
                \"head\": \"$BRANCH_NAME\",
                \"title\": \"🤖 OpenCode: $BRANCH_NAME\",
                \"body\": \"Generata automaticamente da OpenCode (big-pickle) su richiesta di @$COMMENT_AUTHOR.\n\nPiano: \`issue_plans/${{ steps.ctx.outputs.plan_key }}.md\`\n\nChiude #$ISSUE_NUMBER\"
              }")
            PR_NUMBER=$(echo "$RESP" | jq -r '.number // empty')
            # Se la PR esiste già (branch già pushato in precedenza)
            if [ -z "$PR_NUMBER" ]; then
              PR_NUMBER=$(curl -s \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/pulls?state=open&per_page=50" \
                | jq -r --arg b "$BRANCH_NAME" '.[] | select(.head.ref==$b) | .number' | head -n1)
            fi
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # ── 9. AUTO-MERGE (solo se VERDICT: PASS) ────────────────────────────────
      # Il merge su main attiva automaticamente build-apk.yml → APK pubblicato
      - name: Auto-merge PR in main (solo se PASS)
        if: steps.build_review.outputs.verdict == 'PASS'
        run: |
          API="$GH_API/repos/$REPO"
          PR_NUMBER="${{ steps.push.outputs.pr_number }}"
          [ -z "$PR_NUMBER" ] && PR_NUMBER="${{ steps.ctx.outputs.pr_number }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "Nessuna PR da mergeare (nessuna modifica al codice)."
            exit 0
          fi

          echo "🔀 Auto-merging PR #$PR_NUMBER in main..."

          # Attendi stato mergeable (max ~60s)
          for attempt in $(seq 1 12); do
            MERGEABLE=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/pulls/$PR_NUMBER" | jq -r '.mergeable // "null"')
            [ "$MERGEABLE" = "true" ] && break
            if [ "$MERGEABLE" = "false" ]; then
              echo "PR #$PR_NUMBER non mergeabile (conflitti?). Salto il merge."
              exit 0
            fi
            echo "Stato mergeable: $MERGEABLE. Attendo 5s... ($attempt/12)"
            sleep 5
          done

          MERGE_RESP=$(curl -s -X PUT "$API/pulls/$PR_NUMBER/merge" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{
              \"commit_title\": \"🤖 OpenCode merge: ${{ steps.ctx.outputs.branch_name }} (#$PR_NUMBER)\",
              \"commit_message\": \"Merge automatico da OpenCode dopo VERDICT: PASS.\nChiude #$ISSUE_NUMBER\",
              \"merge_method\": \"squash\"
            }")

          MERGED=$(echo "$MERGE_RESP" | jq -r '.merged // false')
          if [ "$MERGED" = "true" ]; then
            echo "✅ PR #$PR_NUMBER mergiata in main → build-apk.yml si attiverà automaticamente."
          else
            echo "❌ Merge fallito (la PR resta aperta per revisione umana)."
            echo "$MERGE_RESP"
          fi

      # ── 10. Commento di review sulla PR ──────────────────────────────────────
      - name: Posta commento di review sulla PR
        if: always()
        continue-on-error: true
        run: |
          API="$GH_API/repos/$REPO"
          PR_NUMBER="${{ steps.push.outputs.pr_number }}"
          [ -z "$PR_NUMBER" ] && PR_NUMBER="${{ steps.ctx.outputs.pr_number }}"
          if [ -z "$PR_NUMBER" ] || [ ! -s /tmp/review.txt ]; then
            echo "Nessuna PR o review da postare."
            exit 0
          fi
          BODY=$(jq -Rs . < /tmp/review.txt)
          curl -s -X POST "$API/issues/$PR_NUMBER/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"body\":$BODY}" > /dev/null

      # ── 11. Reazioni finali ──────────────────────────────────────────────────
      - name: Reazione finale 🚀
        if: success() && steps.react.outputs.path != ''
        continue-on-error: true
        run: |
          curl -s -X POST "$GH_API/repos/$REPO/${{ steps.react.outputs.path }}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"content":"rocket"}' > /dev/null || true

      - name: Reazione in caso di errore 😕
        if: failure() && steps.react.outputs.path != ''
        continue-on-error: true
        run: |
          curl -s -X POST "$GH_API/repos/$REPO/${{ steps.react.outputs.path }}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"content":"confused"}' > /dev/null || true
